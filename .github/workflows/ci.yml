name: CI

on:
  push:
    branches: [ main, version1_scalingup ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────
  # 1. Static checks that never touch the DB or network
  # ─────────────────────────────────────────────────
  static:
    name: Typecheck + Prisma validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Prisma client isn't part of `postinstall` when scripts are
      # skipped — generate explicitly so tsc has the correct types.
      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: TypeScript
        run: npm run typecheck

  # ─────────────────────────────────────────────────
  # 2. Vitest suite — 1000+ unit + integration tests
  # ─────────────────────────────────────────────────
  tests:
    name: Vitest
    runs-on: ubuntu-latest
    needs: static
    env:
      # Test-only placeholders — real secrets never live in CI.
      NODE_ENV:              test
      JWT_SECRET:            test-jwt-secret-at-least-32-chars-long
      DATABASE_URL:          mysql://test:test@localhost:3306/test
      NEXT_PUBLIC_APP_URL:   http://localhost:9002
      AWS_REGION:            us-east-1
      AWS_ACCESS_KEY_ID:     test-key
      AWS_SECRET_ACCESS_KEY: test-secret
      AWS_S3_BUCKET_NAME:    test-bucket
      STRIPE_SECRET_KEY:     sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test
      CONNECTOR_KEK_B64:     AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  # ─────────────────────────────────────────────────
  # 3. Next.js build — catches export / server component regressions
  # ─────────────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: static
    env:
      NODE_ENV:              production
      NEXT_PHASE:            phase-production-build
      JWT_SECRET:            build-time-placeholder-not-used-in-production-abcdef0123456789
      DATABASE_URL:          mysql://build:placeholder@localhost:3306/build
      NEXT_PUBLIC_APP_URL:   https://valuvault.example
      CONNECTOR_KEK_B64:     AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npx next build

  # ─────────────────────────────────────────────────
  # 4. Dependency vulnerability scan — advisory, non-blocking
  # ─────────────────────────────────────────────────
  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    needs: static
    continue-on-error: true   # advisory only — do not block merge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm audit --production --audit-level=high` fails the step on
      # anything ≥ high. Marked continue-on-error so it does not block
      # merge — findings are surfaced in the check-run summary.
      - name: Audit
        run: npm audit --production --audit-level=high

  # ─────────────────────────────────────────────────
  # Release gate — every downstream job that must succeed to merge.
  # Branch-protection points here.
  # ─────────────────────────────────────────────────
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [static, tests, build]
    steps:
      - name: All required checks passed
        run: echo "static + tests + build passed"
